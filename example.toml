# Параметры расчёта ПЭС. Любой параметр можно не указывать, тогда возьмётся значение
# по умолчанию (tec --help), или переопределить флагом: tec example.toml --elevation 45

elevation = 30          # угол возвышения спутника над горизонтом, градусы; можно несколько: [30, 45, 60]
frequency = 1575.42     # рабочая частота, МГц (GPS L1)
step = 100              # шаг интегрирования по дуге и по высоте, м
peak_height = 300       # высота максимума концентрации электронов, км
half_thickness = 100    # полутолщина слоя ниже максимума, км
# top_half_thickness = 250  # полутолщина выше максимума, км; по умолчанию как half_thickness;
#                            # peak_height + 2 · top_half_thickness не больше 2000

# критическая частота foF2 вдоль трассы, МГц; первая точка над приёмником
profile_step = 500      # шаг между точками, км
profile = [4.923, 4.84, 4.86, 5, 5.275, 5.8, 6.22]
